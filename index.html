<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gelato 3D</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#fffaf5;
  color:#241b18;
  overflow-x:hidden;
}

header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  padding:20px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:20;
  backdrop-filter:blur(15px);
  background:rgba(255,250,245,.75);
}

.logo{
  font-size:25px;
  font-weight:900;
  color:#ff5c8a;
}

nav{
  display:flex;
  gap:25px;
}

nav a{
  text-decoration:none;
  color:#241b18;
  font-weight:bold;
}

.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:120px 8% 60px;
  gap:40px;
}

.text{
  max-width:560px;
  animation:fade 1s ease;
}

.badge{
  display:inline-block;
  background:#ffe0ea;
  color:#e83e72;
  padding:9px 16px;
  border-radius:30px;
  font-weight:bold;
  margin-bottom:20px;
}

h1{
  font-size:clamp(48px,7vw,90px);
  line-height:.95;
  margin-bottom:25px;
}

h1 span{
  color:#ff5c8a;
}

.text p{
  font-size:19px;
  line-height:1.6;
  color:#665a56;
  margin-bottom:30px;
}

.buttons{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

button{
  border:0;
  padding:15px 25px;
  border-radius:35px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}

.primary{
  background:#ff5c8a;
  color:white;
  box-shadow:0 10px 30px rgba(255,92,138,.3);
}

.secondary{
  background:white;
  color:#241b18;
  border:1px solid #eee;
}

button:hover{
  transform:translateY(-4px) scale(1.03);
}

/* CENA 3D */

.scene{
  width:440px;
  height:500px;
  perspective:1000px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.icecream{
  position:relative;
  width:250px;
  height:390px;
  transform-style:preserve-3d;
  animation:float 4s ease-in-out infinite;
  cursor:pointer;
}

.scoop{
  position:absolute;
  width:190px;
  height:190px;
  border-radius:50%;
  left:30px;
  top:25px;
  background:radial-gradient(circle at 30% 25%,#fff 0 5%,#ffb6ca 20%,#ff6f9c 60%,#d93668 100%);
  box-shadow:
    inset -25px -25px 35px rgba(130,20,60,.25),
    20px 25px 25px rgba(0,0,0,.15);
  transform:translateZ(40px);
}

.scoop:before,
.scoop:after{
  content:"";
  position:absolute;
  width:30px;
  height:30px;
  background:#fff;
  border-radius:50%;
  opacity:.6;
}

.scoop:before{
  top:35px;
  left:40px;
}

.scoop:after{
  bottom:40px;
  right:35px;
}

.scoop2{
  position:absolute;
  width:170px;
  height:170px;
  border-radius:50%;
  left:10px;
  top:105px;
  background:radial-gradient(circle at 30% 25%,#fff,#ffd27d 25%,#ff9c3e 65%,#d85b16);
  box-shadow:inset -20px -20px 30px rgba(100,40,0,.2);
  transform:translateZ(10px);
}

.scoop3{
  position:absolute;
  width:170px;
  height:170px;
  border-radius:50%;
  right:5px;
  top:105px;
  background:radial-gradient(circle at 30% 25%,#fff,#bdeaff 25%,#65c9f5 65%,#258bc4);
  box-shadow:inset -20px -20px 30px rgba(0,70,120,.2);
  transform:translateZ(20px);
}

.cone{
  position:absolute;
  width:170px;
  height:230px;
  left:40px;
  top:210px;
  background:
    linear-gradient(30deg,transparent 45%,rgba(130,65,20,.25) 46% 50%,transparent 51%) 0 0/35px 35px,
    linear-gradient(-30deg,transparent 45%,rgba(130,65,20,.25) 46% 50%,transparent 51%) 0 0/35px 35px,
    #e9a45d;
  clip-path:polygon(10% 0,90% 0,55% 100%,45% 100%);
  filter:drop-shadow(15px 20px 15px rgba(0,0,0,.2));
  transform:translateZ(0);
}

.shadow{
  position:absolute;
  width:300px;
  height:50px;
  background:rgba(0,0,0,.12);
  filter:blur(15px);
  border-radius:50%;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
}

.menu{
  padding:90px 8%;
  background:white;
  text-align:center;
}

.menu h2{
  font-size:45px;
  margin-bottom:45px;
}
